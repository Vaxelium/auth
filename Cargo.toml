[package]
name = "auth"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { git = "https://github.com/Vaxelium/common", branch = "main" }
anyhow = "1"
argon2 = "0.6.0"
rand = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chacha20poly1305 = "0.10"
resend-rs = "0.36.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "native-tls"] }
serde = { version = "1", features = ["derive"] }
